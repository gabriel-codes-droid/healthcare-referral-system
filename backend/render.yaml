services:
  - type: web
    name: healthcare-referral-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
